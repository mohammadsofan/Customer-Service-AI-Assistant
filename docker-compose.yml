version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai_assistant_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:-StrongP@ssw0rd!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "SA", "-P", "${DB_PASSWORD:-StrongP@ssw0rd!}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai_assistant_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=AIEmployeeSupportDb;User Id=SA;Password=${DB_PASSWORD:-StrongP@ssw0rd!};TrustServerCertificate=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER:-AIEmployeeSupport}
      - JwtSettings__Audience=${JWT_AUDIENCE:-AIEmployeeSupportClient}
      - EncryptionSettings__Key=${ENCRYPTION_KEY}
      - CorsSettings__AllowedOrigins:0=${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: ai_assistant_client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db_data:
